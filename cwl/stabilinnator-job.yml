# Example job file for stabiliNNator CWL workflow
# Run with: cwltool stabilinnator.cwl stabilinnator-job.yml

# Input structure file (use one of the test proteins)
input_file:
  class: File
  path: ../test_data/3ft7.pdb

# Analysis type: 'proline' or 'disulfide'
analysis_type: proline

# Optional: custom model file
# model_path:
#   class: File
#   path: /path/to/custom_model.pt

# Hidden dimension (default: 32, matches pre-trained models)
hidden_dim: 32

# Compute device: 'cpu' recommended (faster than GPU for these small models)
device: cpu

# Output filename
output_filename: 3ft7_proline.pdb
